name: Release a pack

# Tag format: <pack-id>/v<version>, e.g. shonan-it/v0.1.0 (must match pack.yaml).
on:
  push:
    tags: ["*/v*"]

permissions:
  contents: write   # create the GitHub release
  id-token: write   # Sigstore keyless signing (GitHub OIDC)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r tools/requirements.txt
      - run: python tools/validate.py
      - name: Check tag against pack.yaml
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME}"
          PACK="${TAG%%/v*}"
          VERSION="${TAG##*/v}"
          test -f "packs/${PACK}/pack.yaml"
          ACTUAL=$(python -c "import yaml,sys; print(yaml.safe_load(open('packs/${PACK}/pack.yaml'))['version'])")
          test "${ACTUAL}" = "${VERSION}" || { echo "tag ${VERSION} != pack.yaml ${ACTUAL}"; exit 1; }
          echo "pack=${PACK}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Build a reproducible archive
        run: |
          mkdir -p dist
          tar --sort=name --mtime='2026-01-01 00:00Z' --owner=0 --group=0 --numeric-owner \
            --exclude='data/build' --exclude='evals' \
            -czf "dist/${{ steps.meta.outputs.pack }}-${{ steps.meta.outputs.version }}.tar.gz" \
            -C packs "${{ steps.meta.outputs.pack }}"
      - name: Sign with Sigstore (keyless)
        uses: sigstore/gh-action-sigstore-python@v3.5.0
        with:
          inputs: dist/*.tar.gz
      - name: Publish the release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
